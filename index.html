<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9fafb">
  <link rel="manifest" href="manifest.json">
  <title>Kharcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --line-subtle: #f4f4f5;
      --accent: #18181b;
      --accent-soft: #f4f4f5;
      --green: #15803d;
      --green-soft: #f0fdf4;
      --red: #b91c1c;
      --red-soft: #fef2f2;
      --blue: #1d4ed8;
      --blue-soft: #eff6ff;
      --orange: #b45309;
      --orange-soft: #fffbeb;
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; outline: none; }
    button { cursor: pointer; transition: opacity 0.15s ease, transform 0.15s ease; }
    button:active { transform: scale(0.98); opacity: 0.9; }

    .app {
      max-width: 440px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .top {
      padding: 24px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 700; font-size: 24px; letter-spacing: -0.6px; }
    .sub { font-size: 12px; color: var(--muted); font-weight: 500; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin: 12px 16px;
    }

    .hero {
      background: #18181b;
      color: #ffffff;
      border: 1px solid #27272a;
      padding: 22px 20px;
    }
    .hero .label { color: #a1a1aa; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
    .hero .big {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin-top: 4px;
      color: #ffffff;
    }
    .hero .small { color: #a1a1aa; margin-top: 8px; font-size: 12px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 16px;
    }
    .mini {
      margin: 0;
      padding: 14px 16px;
      border-radius: 16px;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .amount { font-size: 18px; font-weight: 700; margin-top: 4px; letter-spacing: -0.4px; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }

    .nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(min(440px, 100%) - 32px);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border-radius: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      z-index: 50;
    }
    .nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border-radius: 12px;
      flex: 1;
    }
    .nav button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav button.active {
      color: var(--ink);
      background: var(--accent-soft);
    }
    .nav button.active svg { stroke: var(--ink); }

    .floating-fab {
      position: fixed;
      bottom: 84px;
      right: calc(50% - 195px);
      width: 50px;
      height: 50px;
      background: #18181b;
      color: #ffffff;
      border-radius: 16px;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      z-index: 55;
      cursor: pointer;
    }
    @media (max-width: 440px) {
      .floating-fab { right: 18px; }
    }
    .floating-fab svg { width: 22px; height: 22px; stroke: #ffffff; stroke-width: 2.2; }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.15s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.success { background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0; }
    .badge.warning { background: var(--orange-soft); color: var(--orange); border: 1px solid #fef08a; }
    .badge.danger { background: var(--red-soft); color: var(--red); border: 1px solid #fecaca; }
    .badge.info { background: var(--blue-soft); color: var(--blue); border: 1px solid #bfdbfe; }

    .pill {
      padding: 5px 12px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
    }
    .pill.active-pill {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }
    .pill.danger { background: var(--red-soft); color: var(--red); border-color: #fecaca; }
    
    .section-title {
      padding: 22px 20px 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      background: #18181b;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
    }
    .btn.secondary { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }

    .field { margin: 13px 0; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
    }
    .field input:focus, .field select:focus {
      border-color: var(--ink);
    }

    .catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 600;
      font-size: 11px;
      min-height: 76px;
    }
    .cat-img { width: 30px; height: 30px; object-fit: cover; border-radius: 8px; }

    .list { margin-top: 8px; }
    .item { padding: 12px 0; border-bottom: 1px solid var(--line-subtle); }
    .item:last-child { border-bottom: 0; }
    .small { font-size: 12px; color: var(--muted); }

    .tabs { display: flex; background: var(--accent-soft); border-radius: 12px; padding: 3px; gap: 3px; border: 1px solid var(--line); }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 7px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 12px; }
    .tabs button.sel { background: #ffffff; color: var(--ink); border: 1px solid rgba(0,0,0,0.06); }

    .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .sheet {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      margin: auto 0 0;
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
      border-radius: 24px 24px 0 0;
      max-height: 88vh;
      overflow-y: auto;
      border-top: 1px solid var(--line);
    }
    .sheet-handle { width: 32px; height: 4px; background: #d4d4d8; border-radius: 99px; margin: 0 auto 16px; }

    .empty { text-align: center; padding: 32px 10px; color: var(--muted); font-size: 13px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { padding: 9px 0; text-align: center; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; background: transparent; }
    .day.has { background: var(--accent-soft); color: var(--ink); border-color: var(--line); }
    .day.sel { background: var(--ink); color: white; }
    .analysis { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div class="brand">Kharcha</div>
        <div class="sub">Track • Plan • Chill</div>
      </div>
      <div class="badge" style="background:#f4f4f5;color:var(--muted);border:1px solid var(--line);">Local & Offline</div>
    </div>

    <section id="home" class="screen active"></section>
    <section id="expenses" class="screen"></section>
    <section id="borrow" class="screen"></section>
    <section id="calendar" class="screen"></section>
    <section id="reports" class="screen"></section>
    <section id="more" class="screen"></section>

    <!-- Floating Minimalist FAB -->
    <button class="floating-fab" id="addBtn" title="Add Expense">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Minimal 5-Tab Navigation -->
    <nav class="nav">
      <button data-s="home">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </button>
      <button data-s="expenses">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Kharcha
      </button>
      <button data-s="borrow">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Borrow
      </button>
      <button data-s="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
      <button data-s="reports">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Reports
      </button>
      <button data-s="more">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        More
      </button>
    </nav>
  </div>

  <div id="modal" class="modal">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    const KEY = 'kharcha_v2';
    const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id_' + Math.random().toString(36).substr(2, 9) + Date.now();

    let db = JSON.parse(localStorage.getItem(KEY) || 'null') || {
      salary: 0,
      salaryDate: '',
      savingsTarget: 0,
      income: [],
      expenses: [],
      borrows: [],
      cards: [],
      cardPayments: [],
      investments: [],
      categories: [
        ['Food', '🍔', ''], ['Travel', '🚕', ''], ['Shopping', '🛍️', ''],
        ['Bills', '📄', ''], ['Education', '📚', ''], ['Health', '💊', ''],
        ['Household', '🏠', ''], ['Entertainment', '🎬', ''], ['Other', '✨', '']
      ],
      setup: false
    };

    if (!db.investments) db.investments = [];
    if (!db.cardPayments) db.cardPayments = [];
    if (db.savingsTarget === undefined) db.savingsTarget = 0;
    if (!db.categories.some(c => c[0] === 'Committee')) db.categories.push(['Committee', '🤝', '']);
    db.expenses.forEach(x => { if (!x.id) x.id = uid(); });
    db.cards.forEach(x => { if (!x.id) x.id = uid(); });
    db.investments.forEach(x => { if (!x.id) x.id = uid(); });

    // Migrate borrows to support multi-tranche / top-up receipts
    db.borrows.forEach(x => {
      if (!x.id) x.id = uid();
      if (!x.receipts || x.receipts.length === 0) {
        x.receipts = [{ amount: Number(x.total || 0), date: x.date, note: x.note || 'Initial borrow' }];
      }
    });

    let calView = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let passbookView = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let passbookFilter = 'ALL';
    let savingsViewTab = 'ASSETS';

    const save = () => localStorage.setItem(KEY, JSON.stringify(db));
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    
    const catIcon = c => {
      if (c && c[0] === 'Borrow Repayment') return `<span style="font-size:22px;">🤝</span>`;
      if (c && c[2]) {
        return `<img src="${c[2]}" alt="${esc(c[0])}" class="cat-img">`;
      }
      return `<span style="font-size:22px;">${esc((c && c[1]) || '📦')}</span>`;
    };

    const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
    const today = () => new Date().toISOString().slice(0, 10);
    const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

    function isCreditCardMethod(method) {
      return String(method || '').startsWith('Credit Card (');
    }

    function cardIdFromMethod(method) {
      let m = String(method || '').match(/^Credit Card \((\d{4})\)$/);
      if (!m) return '';
      let card = db.cards.find(c => c.last4 === m[1]);
      return card ? card.id : '';
    }

    function monthCashExpenses(date = new Date()) {
      return monthExpenses(date).filter(x => !isCreditCardMethod(x.method));
    }

    function cardOutstanding(cardId) {
      let card = db.cards.find(c => c.id === cardId);
      if (!card) return 0;
      let method = `Credit Card (${card.last4})`;
      let purchases = (db.expenses || []).filter(x => x.method === method)
        .reduce((a, x) => a + Number(x.amount || 0), 0);
      let payments = (db.cardPayments || []).filter(x => x.cardId === cardId)
        .reduce((a, x) => a + Number(x.amount || 0), 0);
      return Math.max(0, purchases - payments);
    }

    function monthCardPayments(date = new Date()) {
      let y = date.getFullYear(), m = date.getMonth();
      return (db.cardPayments || []).filter(x => {
        let d = new Date(x.date + 'T00:00');
        return d.getFullYear() === y && d.getMonth() === m;
      });
    }

    function allExpenses() {
      let list = [...(db.expenses || [])];
      (db.borrows || []).forEach(b => {
        (b.payments || []).forEach((p, idx) => {
          list.push({
            id: 'repay_' + b.id + '_' + idx,
            borrowId: b.id,
            amount: Number(p.amount),
            category: 'Borrow Repayment',
            method: p.method || 'UPI',
            date: p.date,
            note: `Repayment to ${b.from}`,
            paidFrom: 'Salary / Income',
            isRepayment: true
          });
        });
      });
      return list;
    }

    function monthExpenses(date = new Date()) {
      let y = date.getFullYear(), m = date.getMonth();
      return allExpenses().filter(x => {
        let d = new Date(x.date + 'T00:00');
        return d.getFullYear() === y && d.getMonth() === m;
      });
    }

    function monthInvestments(date = new Date()) {
      let y = date.getFullYear(), m = date.getMonth();
      return (db.investments || []).filter(x => {
        let d = new Date(x.date + 'T00:00');
        return d.getFullYear() === y && d.getMonth() === m;
      }).reduce((a, x) => a + Number(x.amount || 0), 0);
    }

    function totalAllInvestments() {
      return (db.investments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
    }

    function totalSpentFromSavings(thisMonthOnly = false) {
      let y = new Date().getFullYear(), m = new Date().getMonth();
      return (db.expenses || []).filter(x => {
        let isSaving = x.paidFrom === 'Savings';
        if (!isSaving) return false;
        if (thisMonthOnly) {
          let d = new Date(x.date + 'T00:00');
          return d.getFullYear() === y && d.getMonth() === m;
        }
        return true;
      }).reduce((a, x) => a + Number(x.amount || 0), 0);
    }

    function monthIncome() {
      let d = new Date();
      let arr = db.income.filter(x => {
        let q = new Date(x.date + 'T00:00');
        return q.getFullYear() === d.getFullYear() && q.getMonth() === d.getMonth();
      });
      return Number(db.salary || 0) + arr.reduce((a, x) => a + Number(x.amount), 0);
    }

    function borrowedActive() {
      return db.borrows.reduce((a, x) => a + Math.max(0, Number(x.total) - Number(x.repaid)), 0);
    }

    // Accurately counts all borrow tranches received in the current month
    function monthBorrowedReceived(date = new Date()) {
      let y = date.getFullYear(), m = date.getMonth();
      let sum = 0;
      (db.borrows || []).forEach(b => {
        if (b.receipts && b.receipts.length > 0) {
          b.receipts.forEach(r => {
            let q = new Date(r.date + 'T00:00');
            if (q.getFullYear() === y && q.getMonth() === m) {
              sum += Number(r.amount || 0);
            }
          });
        } else {
          let q = new Date(b.date + 'T00:00');
          if (q.getFullYear() === y && q.getMonth() === m) {
            sum += Number(b.total || 0);
          }
        }
      });
      return sum;
    }

    function monthRepayments() {
      let d = new Date(), y = d.getFullYear(), m = d.getMonth();
      return db.borrows.flatMap(x => x.payments || []).filter(p => {
        let q = new Date(p.date + 'T00:00');
        return q.getFullYear() === y && q.getMonth() === m;
      }).reduce((a, p) => a + Number(p.amount || 0), 0);
    }

    function getAllPassbookEntries() {
      let list = [];

      // 1. Inflow: Salary
      if (Number(db.salary) > 0 && db.salaryDate) {
        list.push({
          type: 'IN',
          title: 'Salary Credited',
          sub: 'Primary Income',
          amount: Number(db.salary),
          date: db.salaryDate,
          tag: 'Salary'
        });
      }

      // 2. Inflow: Other Income
      (db.income || []).forEach(item => {
        list.push({
          type: 'IN',
          title: item.name,
          sub: 'Extra / Side Income',
          amount: Number(item.amount),
          date: item.date,
          tag: 'Income'
        });
      });

      // 3. Inflow: Borrow Tranches Received (Initial + Top-ups)
      (db.borrows || []).forEach(b => {
        if (b.receipts && b.receipts.length > 0) {
          b.receipts.forEach((r, idx) => {
            list.push({
              type: 'IN',
              title: `Borrowed from ${b.from}` + (idx > 0 ? ' (Top-up)' : ''),
              sub: `Loan Inflow • ${esc(r.note || b.note || 'No note')}`,
              amount: Number(r.amount),
              date: r.date,
              tag: 'Borrow In'
            });
          });
        } else {
          list.push({
            type: 'IN',
            title: `Borrowed from ${b.from}`,
            sub: `Loan Inflow • ${esc(b.note || 'No note')}`,
            amount: Number(b.total),
            date: b.date,
            tag: 'Borrow In'
          });
        }
      });

      // 4. Outflow: Regular Expenses & Expenses from Savings
      (db.expenses || []).forEach(x => {
        let isFromSavings = x.paidFrom === 'Savings';
        let isCC = isCreditCardMethod(x.method);
        list.push({
          type: isCC ? 'CC' : 'OUT',
          title: x.note || x.category,
          sub: `${x.category} • ${esc(x.method || 'Cash')} ${isCC ? '• (CC Purchase — not paid from cash)' : (isFromSavings ? '• (Dipped from Savings)' : '')}`,
          amount: Number(x.amount),
          date: x.date,
          tag: isCC ? 'CC Purchase' : (isFromSavings ? 'Savings Dipped' : 'Expense')
        });
      });

      // 5. Outflow: Credit-card bill payments (actual cash leaving the account)
      (db.cardPayments || []).forEach(p => {
        let card = db.cards.find(c => c.id === p.cardId);
        list.push({
          type: 'OUT',
          title: `Credit Card Bill Payment${card ? ` •••• ${card.last4}` : ''}`,
          sub: `CC Bill Payment • ${p.method || 'Bank'}`,
          amount: Number(p.amount),
          date: p.date,
          tag: 'CC Payment'
        });
      });

      // 6. Outflow: Borrow Repayments
      (db.borrows || []).forEach(b => {
        (b.payments || []).forEach(p => {
          list.push({
            type: 'OUT',
            title: `Repayment to ${b.from}`,
            sub: `Borrow Repayment • ${p.method || 'UPI'}`,
            amount: Number(p.amount),
            date: p.date,
            tag: 'Repay'
          });
        });
      });

      // 7. Outflow/Allocation: Savings & Investments
      (db.investments || []).forEach(inv => {
        list.push({
          type: 'OUT',
          title: inv.name,
          sub: `${inv.type} • ${esc(inv.note || 'Saving / Asset')}`,
          amount: Number(inv.amount),
          date: inv.date,
          tag: 'Invested'
        });
      });

      return list.sort((a, b) => b.date.localeCompare(a.date));
    }

      document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));

      render();
    }

    // TOP-UP MODAL: Add more money borrowed from the same person

      show(`

          <input id="tun" placeholder="e.g. 2nd tranche, hospital help">

        <button class="btn secondary" onclick="openBorrowDetail('${id}')">Back</button>
      `);
    }

    function saveTopUpBorrow(id) {
      let x = db.borrows.find(z => z.id === id);
      if (!x) return;
      let amount = Number(document.getElementById('tua').value);
      let date = document.getElementById('tud').value || today();
      let note = document.getElementById('tun').value.trim();

      if (!amount || amount <= 0) return alert('Enter a valid amount.');
      if (date > today()) return alert('Future dates are not allowed.');

      if (!x.receipts) {
        x.receipts = [{ amount: x.total, date: x.date, note: x.note || 'Initial borrow' }];
      }

      x.receipts.push({
        amount,
        date,
        note: note || `Tranche #${x.receipts.length + 1}`
      });
      x.total += amount;

      save();
      openBorrowDetail(id);
      render();
    }

    function renderCalendar() {
      let d = calView, y = d.getFullYear(), m = d.getMonth();
      let days = new Date(y, m + 1, 0).getDate();
      let first = new Date(y, m, 1).getDay();
      let cells = '';
      let allExp = allExpenses();

      for (let i = 0; i < first; i++) cells += '<div></div>';
      for (let day = 1; day <= days; day++) {
        let ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let has = allExp.some(x => x.date === ds);
        cells += `<button class="day ${has ? 'has' : ''}" onclick="calendarDay('${ds}')">${day}</button>`;
      }

      document.getElementById('calendar').innerHTML = `
        <div class="section-title">Calendar</div>
        <div class="card">
          <div class="row">
            <button class="pill" onclick="changeCalMonth(-1)">‹</button>
            <b>${d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</b>
            <button class="pill" onclick="changeCalMonth(1)">›</button>
          </div>
          <div class="calendar" style="margin-top:14px;">
            <div class="small" style="text-align:center;">S</div>
            <div class="small" style="text-align:center;">M</div>
            <div class="small" style="text-align:center;">T</div>
            <div class="small" style="text-align:center;">W</div>
            <div class="small" style="text-align:center;">T</div>
            <div class="small" style="text-align:center;">F</div>
            <div class="small" style="text-align:center;">S</div>
            ${cells}
          </div>
          <div id="calDetail" class="analysis">Select any date to view expenses and repayments.</div>
        </div>
      `;
    }

    function changeCalMonth(delta) {
      calView = new Date(calView.getFullYear(), calView.getMonth() + delta, 1);

    }

    function calendarDay(ds) {

    function close() {
      const modal = document.getElementById('modal');

        modal.classList.remove('show');
        if (history.state && history.state.modalOpen) {
          history.back();
        }
      }
    }

    window.addEventListener('popstate', function () {

      }
    });

    function toggleBorrowExpense() {
      let r = document.getElementById('ec').value === 'Borrow Repayment';
      document.getElementById('borrowPayFields').style.display = r ? 'block' : 'none';
      document.getElementById('normalExpenseFields').style.display = r ? 'none' : 'block';
      document.getElementById('repayMethodFields').style.display = r ? 'block' : 'none';
    }

    function saveExpense() {
      let amount = Number(document.getElementById('ea').value);
      let cat = document.getElementById('ec').value;
      if (!amount) return alert('Enter a valid amount.');

      if (cat === 'Borrow Repayment') {
        let x = db.borrows.find(z => z.id === document.getElementById('eborrow').value);
        if (!x) return alert('Select an active borrow.');
        let rem = Number(x.total) - Number(x.repaid);
        if (amount > rem) return alert(`You cannot repay more than ${money(rem)}.`);
        
        let paymentDate = (document.getElementById('ed') && document.getElementById('ed').value) || (document.getElementById('ed_normal') && document.getElementById('ed_normal').value) || today();
        if (paymentDate > today()) return alert('Future dates are not allowed.');

        x.repaid += amount;
        x.payments = x.payments || [];
        x.payments.push({
          amount,
          date: paymentDate,
          method: document.getElementById('rem') ? document.getElementById('rem').value : 'UPI'
        });
        save(); close(); render();
        return;
      }

      let expenseDate = document.getElementById('ed_normal').value || today();
      if (expenseDate > today()) return alert('Future dates are not allowed.');
      let expenseMethod = document.getElementById('em').value;
      db.expenses.push({
        id: uid(),
        amount,
        category: cat,
        method: expenseMethod,
        cardId: cardIdFromMethod(expenseMethod),
        date: expenseDate,
        note: document.getElementById('en').value.trim(),
        paidFrom: document.getElementById('ep').value
      });
      save(); close(); render();
    }

        <button class="btn secondary" onclick="openCategories()">Back</button>
      `);
    }

    function previewImage(input, previewId) {
      let file = input.files?.[0];
      if (!file) return;
      let r = new FileReader();
      r.onload = () => {
        document.getElementById(previewId).innerHTML = `
          <img src="${r.result}" style="width:50px;height:50px;object-fit:cover;border-radius:10px;">
          <div class="small" style="color:var(--green);font-weight:600;margin-top:4px;">Photo selected</div>
        `;
      };
      r.readAsDataURL(file);
    }

    function removeCatImage(i) {
      db.categories[i][2] = '';
      save();
      editCategory(i);
    }

    function saveCategoryEdit(i) {
      let name = document.getElementById('ecn').value.trim();
      if (!name) return alert('Category name cannot be empty.');
      db.categories[i][0] = name;
      db.categories[i][1] = document.getElementById('ecEmoji').value.trim() || '📦';

      let file = document.getElementById('ecFile')?.files?.[0];
      if (file) {
        let r = new FileReader();
        r.onload = () => {
          db.categories[i][2] = r.result;
          save(); close(); render();
        };
        r.readAsDataURL(file);
      } else {
        save(); close(); render();
      }
    }

    function openAddCategory() {
      show(`
        <h2 style="margin-top:0;font-size:20px;">Add Category</h2>
        <div class="field">
          <label>Category Name</label>
          <input id="acn" placeholder="e.g. Gym, Pet, Fuel">
        </div>
        <div class="field">
          <label>Photo from Gallery (Optional)</label>
          <input type="file" id="acFile" accept="image/*" onchange="previewImage(this, 'addCatPreview')">
        </div>
        <div id="addCatPreview" style="margin:8px 0;text-align:center;"></div>
        <div class="field">
          <label>Or Emoji Icon</label>
          <input id="acEmoji" placeholder="e.g. 🏋️">
        </div>
        <button class="btn" onclick="saveNewCategory()">Add Category</button>
        <button class="btn secondary" onclick="openCategories()">Back</button>
      `);
    }

    function saveNewCategory() {
      let name = document.getElementById('acn').value.trim();
      let emoji = document.getElementById('acEmoji').value.trim() || '📦';
      if (!name) return alert('Enter category name.');
      let file = document.getElementById('acFile')?.files?.[0];

      if (file) {
        let r = new FileReader();
        r.onload = () => {
          db.categories.push([name, emoji, r.result]);
          save(); close(); render();
        };
        r.readAsDataURL(file);
      } else {
        db.categories.push([name, emoji, '']);
        save(); close(); render();
      }
    }

    function openCard() {
      show(`
        <h2 style="margin-top:0;font-size:20px;">Credit Cards</h2>
        <div class="field">
          <label>Last 4 Digits</label>
          <input id="c4" maxlength="4" inputmode="numeric" placeholder="4321">
        </div>
        <div class="field">
          <label>Card Limit (Optional)</label>
          <input id="cl" type="number" inputmode="decimal" placeholder="₹50,000">
        </div>
        <button class="btn" onclick="saveCard()">Save Card</button>
        <div class="list" style="margin-top:16px;">
          ${db.cards.map(c => `
            <div class="item" style="margin-bottom:10px;">
              <div class="row">
                <div>
                  <b>•••• ${esc(c.last4)}</b>
                  <div class="small">Limit: ${money(c.limit)}</div>
                </div>
                <b class="red">${money(cardOutstanding(c.id))}</b>
              </div>
              <div class="small" style="margin-top:5px;">Outstanding / pending bill</div>
              <div class="row" style="margin-top:9px;gap:6px;">
                <button class="pill" onclick="openCardPayment('${c.id}')">Pay Bill</button>
                <button class="pill danger" onclick="deleteCard('${c.id}')">Remove</button>
              </div>
            </div>
          `).join('') || '<div class="empty">No cards added.</div>'}
        </div>
      `);
    }

    function openCardPayment(cardId) {
      let card = db.cards.find(c => c.id === cardId);
      if (!card) return;
      let outstanding = cardOutstanding(cardId);
      show(`
        <h2 style="margin-top:0;font-size:20px;">Pay Credit Card Bill</h2>
        <div class="card" style="margin:10px 0 14px;">
          <div class="label">Card</div>
          <div class="amount">•••• ${esc(card.last4)}</div>
          <div class="small">Current outstanding: <b>${money(outstanding)}</b></div>
        </div>
        <div class="field">
          <label>Amount Paid</label>
          <input id="cpa" type="number" inputmode="decimal" max="${outstanding}" placeholder="₹0">
        </div>
        <div class="field">
          <label>Paid From</label>
          <select id="cpm">
            <option>UPI</option>
            <option>Bank</option>
            <option>Cash</option>
          </select>
        </div>
        <div class="field">
          <label>Date Paid</label>
          <input id="cpd" type="date" max="${today()}" value="${today()}">
        </div>
        <button class="btn" onclick="saveCardPayment('${cardId}')">Record Bill Payment</button>
      `);
    }

    function saveCardPayment(cardId) {
      let amount = Number(document.getElementById('cpa').value);
      let date = document.getElementById('cpd').value || today();
      let method = document.getElementById('cpm').value;
      let outstanding = cardOutstanding(cardId);
      if (!amount || amount <= 0) return alert('Enter a valid amount.');
      if (amount > outstanding) return alert(`Payment cannot exceed outstanding ${money(outstanding)}.`);
      if (date > today()) return alert('Future dates are not allowed.');
      db.cardPayments.push({ id: uid(), cardId, amount, method, date });
      save(); close(); render();
    }

    function saveCard() {
      let v = document.getElementById('c4').value.replace(/\D/g, '');
      if (v.length !== 4) return alert('Enter 4 digits.');
      if (db.cards.some(c => c.last4 === v)) return alert('This card is already added.');
      db.cards.push({ id: uid(), last4: v, limit: Number(document.getElementById('cl').value || 0) });
      save(); close(); render();
    }

    function exportData() {
      let blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kharcha-backup-${today()}.json`;
      a.click();
    }

    function deleteExpense(id) {
      if (confirm('Delete this expense?')) {
        db.expenses = db.expenses.filter(x => x.id !== id);
        save(); render();
      }
    }
    function deleteIncome(i) {
      if (confirm('Delete this income?')) {
        db.income.splice(i, 1);
        save(); render(); openOtherIncome();
      }
    }
    function deleteCard(id) {
      if (confirm('Delete this card?')) {
        db.cards = db.cards.filter(x => x.id !== id);
        save(); render(); openCard();
      }
    }
    function deleteCategory(i) {
      if (db.categories.length <= 1) return alert('Keep at least 1 category.');
      if (confirm(`Remove "${db.categories[i][0]}"?`)) {
        db.categories.splice(i, 1);
        save(); render(); openCategories();
      }
    }
    function deleteBorrow(id) {
      if (confirm('Permanently delete this settled borrow and its complete repayment log?')) {
        db.borrows = db.borrows.filter(x => x.id !== id);
        save(); close(); render();
      }
    }
    function resetData() {
      if (confirm('Delete all app data on this phone?')) {
        localStorage.removeItem(KEY);
        location.reload();
      }
    }

    document.querySelectorAll('.nav button[data-s]').forEach(b => b.onclick = () => nav(b.dataset.s));
    document.getElementById('addBtn').onclick = () => openExpense();
    render();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
